# admin/config.yml
# -----------------
# This file defines every editable form in /admin. Read top to bottom:
#
#   backend        — where content is saved. "github" means every save
#                    here is a real commit to your repo, which is what
#                    triggers the site to rebuild and republish.
#   media_folder    — where uploaded images are stored in the repo.
#   public_folder   — the URL path those images are served at on the
#                      live site (must match .eleventy.js's passthrough).
#   collections     — the actual editable content types: Projects (one
#                      entry per project, unlimited), and Pages (About
#                      and Contact, exactly one of each).
#
# IMPORTANT: change "repo" below to your actual "github-username/repo-name"
# once you've created the repository — see the README for the full setup.

backend:
  name: github
  repo: junedmto/dmto-portfolio
  branch: main

media_folder: "src/assets/img/uploads"
public_folder: "/assets/img/uploads"

collections:
  - name: projects
    label: Projects
    label_singular: Project
    folder: src/projects
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}} — {{category}} {{draft | ternary('· HIDDEN', '')}}"
    sortable_fields: [title]
    reorder: true
    key: order
    fields:
      - { label: Title, name: title, widget: string }
      - label: Category
        name: category
        widget: select
        options:
          - Graphic Design
          - Motion Graphics
          - Illustration
          - 3D Modelling
          - Animation
          - Editorial Design
          - Packaging
          - ArchViz
          - Interactive Web Design
          - Artificial Intelligence
          - Residential Architectural Design
          - Other
      - { label: "Other category (only if you chose Other)", name: category_other, widget: string, required: false }
      - { label: "Hidden (draft) - keep it here but don't show it on the site", name: draft, widget: boolean, default: false, required: false }
      - { label: Description, name: description, widget: text }
      # Photos AND videos (mp4, webm, mov). Because this is a plain "file"
      # widget with multiple: true, the CMS saves a simple list of paths
      # and you can drag to reorder them.
      - label: Homepage image (optional, otherwise the first gallery item is used)
        name: cover
        widget: file
        required: false
      - { label: Gallery (photos and videos), name: gallery, widget: file, multiple: true }
      - { label: "Photos per row (optional, e.g. 3, 2, 4)", name: row_layout, widget: string, required: false, hint: "Row 1 gets 3 items, row 2 gets 2, row 3 gets 4. Anything left over arranges itself. Leave empty for fully automatic." }
      - { label: Extra notes (optional), name: body, widget: markdown, required: false }
        

  - name: pages
    label: Pages
    editor:
      preview: false
    files:
      - name: home
        label: Homepage
        file: src/_data/home.json
        format: json
        fields:
          - label: Photos per row (optional, e.g. 2, 1, 3)
            name: row_layout
            widget: string
            required: false
            hint: Row 1 gets 2 projects, row 2 gets 1, row 3 gets 3. Anything left over arranges itself. Leave empty for fully automatic.
      - name: about
        label: About
        file: src/about.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: SEO description, name: description, widget: string }
          - { label: Bio, name: body, widget: markdown }
          - { label: Photo, name: photo, widget: image, required: false }
          - label: Education
            name: education
            widget: list
            fields:
              - { label: School, name: school, widget: string }
              - { label: Degree, name: degree, widget: string }
          - label: Publications
            name: publications
            widget: list
            required: false
            fields:
              - { label: Title, name: title, widget: string }
              - { label: URL, name: url, widget: string }
          - label: Skills
            name: skills
            widget: list
            field: { label: Skill, name: skill, widget: string }

      - name: contact
        label: Contact
        file: src/contact.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: SEO description, name: description, widget: string }
          - { label: Scrolling greetings, name: marquee, widget: string }
          - { label: Intro text (first paragraph is shown bold), name: body, widget: markdown }
          - { label: Email, name: email, widget: string }
          - { label: Phone, name: phone, widget: string, required: false }
          - { label: Instagram URL, name: instagram, widget: string, required: false }
